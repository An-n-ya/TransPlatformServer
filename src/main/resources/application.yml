server:
  port: 8080

spring:
  config:
    import:
      - optional:file:./storage.yml
      - optional:classpath:storage.yml
  profiles:
    active: dev

  application:
    name: trans-platform

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    # 注意：该配置只对 java.util.Date 序列化生效，对 LocalDateTime 无效。
    # LocalDateTime 的写入/读取取决于 JVM 默认时区，已由 AppApplication.main()
    # 在启动前固定为 Asia/Shanghai（可用 APP_TIMEZONE 环境变量覆盖）。
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  jpa:
    open-in-view: false
    hibernate:
      # SQLite 表结构由 Flyway 管理，Hibernate 不校验/不生成
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.community.dialect.SQLiteDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# Admin bootstrap (首次启动自动创建管理员)
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:TEMP_DEV_SECRET_CHANGE_IN_PROD_AT_LEAST_32_CHARS}
  access-token-expiration: 86400000    # 24 hours
  refresh-token-expiration: 2592000000 # 30 days

# Logging
logging:
  level:
    com.app: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:sqlite:${SQLITE_PATH:data/trans_platform.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者模型，连接池用 1 避免数据库锁冲突
      maximum-pool-size: 1
      connection-timeout: 20000

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.export.simple.SimpleMetricsExportAutoConfiguration

  metrics:
    export:
      simple:
        enabled: false
    binders:
      processor:
        enabled: false
      jvm:
        enabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 10

# Cache (Redis)
cache:
  post-ttl: 300         # 5 min
  user-ttl: 1800        # 30 min
  hot-posts-ttl: 60     # 1 min

# Feed config
feed:
  max-size: 500         # max posts per feed list

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # SQLite 文件路径，Docker 部署时挂载持久化卷
    url: jdbc:sqlite:${SQLITE_PATH:/app/data/trans_platform.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者模型，连接池用 1 避免数据库锁冲突
      maximum-pool-size: 1
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 3000
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 8

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

logging:
  level:
    com.app: INFO

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: "jdbc:sqlite::memory:"
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration

jwt:
  secret: TEST_SECRET_KEY_CHANGE_IN_PROD_AT_LEAST_32_CHARS
  access-token-expiration: 86400000
  refresh-token-expiration: 2592000000
