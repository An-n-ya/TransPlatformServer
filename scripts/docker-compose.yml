# =====================================================================
# TransPlatform — 一键启动编排（SQLite 版）
#
# 用法:
#   cd scripts
#   docker compose up -d                 # 使用默认持久化目录 /var/opt/trans
#   DATA_DIR=/mnt/data docker compose up -d   # 自定义持久化目录
#
# 停止:
#   docker compose down                  # 停止（保留数据）
# =====================================================================

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: prod
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
  # SQLite 数据库文件路径（挂载持久化卷）
  SQLITE_PATH: /app/data/trans_platform.db
  # 生产环境务必替换为强随机密钥（至少 32 字符）
  JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_PRODUCTION_SECRET_32_CHARS_MIN}

services:
  redis:
    image: redis:7
    container_name: trans-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_DIR:-/var/opt/trans}/redis:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: trans-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ${DATA_DIR:-/var/opt/trans}/rabbitmq:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
    image: trans-platform:latest
    container_name: trans-app
    restart: unless-stopped
    environment:
      <<: *app-env
      # 存储配置（mock=本地磁盘；如需云存储可改为 cos/s3 并补充密钥）
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-mock}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      # 逆地理编码 API Key（默认 BigDataCloud，失败回退百度；从 scripts/.env 或宿主环境变量读取）
      BAIDU_API_KEY: ${BAIDU_API_KEY:-}
      BIG_DATA_CLOUD_KEY_API: ${BIG_DATA_CLOUD_KEY_API:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      # 持久化 SQLite 数据库 —— 默认宿主目录 /var/opt/trans/data
      - ${DATA_DIR:-/var/opt/trans}/data:/app/data
      # 持久化上传文件 —— 默认宿主目录 /var/opt/trans/uploads
      - ${DATA_DIR:-/var/opt/trans}/uploads:/app/uploads
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
