# =====================================================================
# TransPlatform — 一键启动编排
#
# 用法:
#   cd scripts
#   docker compose up -d                 # 使用默认持久化目录 /var/opt/trans
#   DATA_DIR=/mnt/data docker compose up -d   # 自定义持久化目录
#
# 停止:
#   docker compose down                  # 停止（保留数据）
#   docker compose down -v              # 停止并删除数据卷
# =====================================================================

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: prod
  MYSQL_HOST: mysql
  MYSQL_USERNAME: root
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
  # 生产环境务必替换为强随机密钥（至少 32 字符）
  JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_PRODUCTION_SECRET_32_CHARS_MIN}

services:
  mysql:
    image: mysql:8.0
    container_name: trans-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: trans_platform
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 持久化 MySQL 数据 —— 可通过 DATA_DIR 自定义宿主目录
      - ${DATA_DIR:-/var/opt/trans}/mysql:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: trans-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_DIR:-/var/opt/trans}/redis:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: trans-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ${DATA_DIR:-/var/opt/trans}/rabbitmq:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
    image: trans-platform:latest
    container_name: trans-app
    restart: unless-stopped
    environment:
      <<: *app-env
      # 存储配置（mock=本地磁盘；如需云存储可改为 cos/s3 并补充密钥）
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-mock}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
    volumes:
      # 持久化上传文件 —— 默认宿主目录 /var/opt/trans/uploads
      - ${DATA_DIR:-/var/opt/trans}/uploads:/app/uploads
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
